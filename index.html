<head>

    <!-- Bundled Assets from the updated app -->
    <script type="module" crossorigin
        src="./assets/index-0_XgYowt.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-_ycQS4F2.css">
    
    <!-- Custom Pricing Override -->
    <script src="./assets/custom-pricing.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Accessibility Widget -->
    <script type="text/javascript" src="https://cdn.consentmanager.net/delivery/js/accessibility.min.js" data-acc-accid="a530d56268a4" data-acc-host="delivery.consentmanager.net" data-acc-cdn="cdn.consentmanager.net"></script>

    <style>
        /* Force scrolling for both mobile and desktop */
        html,
        body {
            margin: 0 !important;
            padding: 0 !important;
            overflow: auto !important;
            -webkit-overflow-scrolling: touch !important;
        }

        /* Hide specific elements: gear, Admin, old Privacy Settings */
        .hide-element {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Custom Team Portal link (CRM) - moved to extreme right */
        #portal-tab-custom {
            padding: 0.6rem 1.4rem;
            background: #0070c9;
            color: white !important;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none !important;
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 2147483647;
            /* Ensure it stays above the SPA layer */
            box-shadow: 0 4px 15px rgba(0, 112, 201, 0.4);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: block !important;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        #portal-tab-custom:hover {
            background: #005ea6;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 112, 201, 0.5);
        }

        @media (max-width: 768px) {
            #portal-tab-custom {
                right: 15px;
                top: 80px;
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }
        }

        /* Hide the Introductory Price Mustard Band generated by the React app */
        div[class*="from-amber-50"], div[class*="amber-500"] {
            display: none !important;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <!-- Team Portal points to the CRM (ccrm.html) -->
    <a href="ccrm.html" id="portal-tab-custom">Team Portal</a>

    <script>
        window.__SITE_ID__ = '69923537a592372b8bebdfe6';

        // 1. Legal Footer Injection
        const injectLegalFooter = () => {
            if (!document.getElementById('custom-legal-footer')) {
                const footer = document.createElement('div');
                footer.id = 'custom-legal-footer';
                footer.style.cssText = 'position: relative; width: 100%; background: rgba(15, 23, 42, 0.95); padding: 24px 20px; z-index: 100; display: flex; justify-content: center; align-items: center; gap: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1); flex-wrap: wrap; box-sizing: border-box; font-family: Inter, sans-serif; backdrop-filter: blur(5px); margin-top: 40px;';
                
                const links = [
                    { t: 'Legal:', href: null, col: '#94a3b8' },
                    { t: 'Privacy Policy', href: 'https://drive.google.com/file/d/1facmn0XHT8RXXUIyClodPbqMDcaYP-1h/view?usp=sharing' },
                    { t: 'Terms of Service', href: 'https://drive.google.com/file/d/15dinH7ljCb8FooHwvIpQXrE9MdouHgz1/view?usp=sharing' },
                    { t: 'FAQ\'s', href: 'https://docs.google.com/document/d/1SRFPSK-cVkENgcPIJyO5ZUVoVhuf8VEL/edit' }
                ];
                
                links.forEach(l => {
                    const el = document.createElement(l.href ? 'a' : 'span');
                    el.textContent = l.t;
                    el.style.cssText = `color: ${l.col || '#38bdf8'}; font-weight: ${l.href ? '500' : '600'}; font-size: 0.9rem; text-decoration: none;`;
                    if (l.href) {
                        el.href = l.href;
                        el.target = '_blank';
                        el.style.transition = 'color 0.2s';
                    }
                    footer.appendChild(el);
                });
                
                document.body.appendChild(footer);
            }
        };

        // 2. Safely Inject Custom Pricing Overlay using specific targeting
        const injectPricingOverlay = () => {
            const pricingSection = document.getElementById('pricing');
            if (pricingSection && pricingSection.style.opacity !== '0') {
                pricingSection.style.opacity = '0';
                pricingSection.style.pointerEvents = 'none';

                let overlay = document.getElementById('marketing-pricing-overlay');
                if (!overlay) {
                    overlay = document.createElement('div');
                    overlay.id = 'marketing-pricing-overlay';
                    overlay.innerHTML = window.__CUSTOM_PRICING_HTML__;
                    overlay.style.position = 'absolute';
                    overlay.style.width = '100%';
                    overlay.style.left = '0';
                    overlay.style.zIndex = '50';
                    document.body.appendChild(overlay);
                }

                const rect = pricingSection.getBoundingClientRect();
                overlay.style.top = (rect.top + window.scrollY) + 'px';
                if (overlay.offsetHeight > 0) pricingSection.style.height = overlay.offsetHeight + 'px';
            }
        };

        // Initialize Observer to replace polling
        const observer = new MutationObserver(() => {
            if (document.getElementById('pricing')) injectPricingOverlay();
            injectLegalFooter();
        });
        observer.observe(document.body, { childList: true, subtree: true });

        // On Load guarantees
        window.addEventListener('load', () => {
            injectPricingOverlay();
            injectLegalFooter();
        });

        // 3. Global Click Interceptor for Smooth Scroll & Forms
        document.addEventListener('click', (e) => {
            const target = e.target.closest('a, button, span, p, div');
            if (!target || !target.textContent) return;
            
            const text = target.textContent.trim().toLowerCase();
            const isClickable = window.getComputedStyle(target).cursor === 'pointer' || target.tagName === 'A' || target.tagName === 'BUTTON';
            
            if (isClickable && (text === 'contact us' || text === 'get in touch')) {
                e.preventDefault();
                const headers = document.querySelectorAll('h1, h2, h3, h4, div, span, p');
                for (let h of headers) {
                    const txt = h.textContent.trim().toLowerCase();
                    if (txt === 'get in touch' || txt === "we'd love to hear from you") {
                        const section = h.closest('section');
                        if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        return;
                    }
                }
            }

            if (isClickable && (text === 'send message' || text === 'notify me')) {
                e.preventDefault();
                let subject = text === 'notify me' ? "Pre-Registration from Futurewave.in" : "Inquiry from Futurewave.in";
                let body = "";
                
                const container = target.closest('form') || target.closest('div[class*="mt-"]') || target.closest('section') || document;
                const inputs = container.querySelectorAll('input, document, textarea');
                inputs.forEach(input => {
                    const name = input.getAttribute('placeholder') || input.name || 'Field';
                    body += `${name}: ${input.value}\n\n`;
                });

                window.location.href = `mailto:checkin_support@futurewave.in?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            }
        });
    </script>
    <script src="https://static.famous.ai/events.js"></script>
</body>

</html>
