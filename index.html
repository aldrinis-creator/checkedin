<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://static.famous.ai/debug.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check-iN | AI-Powered Healthcare Assistant & Safety Monitor for Seniors</title>
    <meta name="description"
        content="Check-iN is an AI-powered healthcare assistant designed to support senior citizens in living independently by providing health monitoring and emergency support." />
    <link rel="icon" type="image/svg+xml" href="https://senior-health-guardian.deploypad.app/placeholder.svg" />

    <meta property="og:title" content="Check-iN Health Assistant" />
    <meta property="og:description"
        content="Check-iN is an AI-powered healthcare assistant designed to support senior citizens in living independently by providing health monitoring and emergency support." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://senior-health-guardian.deploypad.app/og.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://senior-health-guardian.deploypad.app/og.jpg" />

    <!-- Bundled Assets from the updated app -->
    <script type="module" crossorigin
        src="./assets/index-0_XgYowt.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-_ycQS4F2.css">
    
    <!-- Custom Pricing Override -->
    <script src="./assets/custom-pricing.js"></script>

    <!-- Accessibility Widget -->
    <script type="text/javascript" src="https://cdn.consentmanager.net/delivery/js/accessibility.min.js" data-acc-accid="a530d56268a4" data-acc-host="delivery.consentmanager.net" data-acc-cdn="cdn.consentmanager.net"></script>

    <style>
        /* Force scrolling for both mobile and desktop */
        html,
        body {
            margin: 0 !important;
            padding: 0 !important;
            overflow: auto !important;
            -webkit-overflow-scrolling: touch !important;
        }

        /* Hide specific elements: gear, Admin, old Privacy Settings */
        .hide-element {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Custom Team Portal link (CRM) - moved to extreme right */
        #portal-tab-custom {
            padding: 0.6rem 1.4rem;
            background: #0070c9;
            color: white !important;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none !important;
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 2147483647;
            /* Ensure it stays above the SPA layer */
            box-shadow: 0 4px 15px rgba(0, 112, 201, 0.4);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: block !important;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        #portal-tab-custom:hover {
            background: #005ea6;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 112, 201, 0.5);
        }

        @media (max-width: 768px) {
            #portal-tab-custom {
                right: 15px;
                top: 80px;
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <!-- Team Portal points to the CRM (ccrm.html) -->
    <a href="ccrm.html" id="portal-tab-custom">Team Portal</a>

    <script>
        window.__SITE_ID__ = '69923537a592372b8bebdfe6';

        const injectLegalFooter = () => {
            if (!document.getElementById('custom-legal-footer')) {
                const footer = document.createElement('div');
                footer.id = 'custom-legal-footer';
                footer.style.cssText = 'position: relative; width: 100%; background: rgba(15, 23, 42, 0.95); padding: 24px 20px; z-index: 100; display: flex; justify-content: center; align-items: center; gap: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1); flex-wrap: wrap; box-sizing: border-box; font-family: Inter, sans-serif; backdrop-filter: blur(5px); margin-top: 40px;';
                
                const legalTitle = document.createElement('span');
                legalTitle.style.cssText = 'color: #94a3b8; font-weight: 600; font-size: 0.9rem;';
                legalTitle.textContent = 'Legal:';
                
                const privacyLink = document.createElement('a');
                privacyLink.href = 'https://drive.google.com/file/d/1facmn0XHT8RXXUIyClodPbqMDcaYP-1h/view?usp=sharing';
                privacyLink.target = '_blank';
                privacyLink.style.cssText = 'color: #38bdf8; text-decoration: none; font-weight: 500; font-size: 0.9rem; transition: color 0.2s;';
                privacyLink.textContent = 'Privacy Policy';
                
                const termsLink = document.createElement('a');
                termsLink.href = 'https://drive.google.com/file/d/15dinH7ljCb8FooHwvIpQXrE9MdouHgz1/view?usp=sharing';
                termsLink.target = '_blank';
                termsLink.style.cssText = 'color: #38bdf8; text-decoration: none; font-weight: 500; font-size: 0.9rem; transition: color 0.2s;';
                termsLink.textContent = 'Terms of Service';
                
                const faqLink = document.createElement('a');
                faqLink.href = 'https://docs.google.com/document/d/1SRFPSK-cVkENgcPIJyO5ZUVoVhuf8VEL/edit?usp=sharing&ouid=106024047286888919119&rtpof=true&sd=true';
                faqLink.target = '_blank';
                faqLink.style.cssText = 'color: #38bdf8; text-decoration: none; font-weight: 500; font-size: 0.9rem; transition: color 0.2s;';
                faqLink.textContent = 'FAQ\'s';

                footer.appendChild(legalTitle);
                footer.appendChild(privacyLink);
                footer.appendChild(termsLink);
                footer.appendChild(faqLink);
                document.body.appendChild(footer);
            }
        };

        const applyFixes = () => {
            document.documentElement.style.setProperty('overflow', 'auto', 'important');
            document.body.style.setProperty('overflow', 'auto', 'important');

            // Move Accessibility Widget to Nav Bar
            try {
                let getStartedBtn = null;
                const allNodes = document.querySelectorAll('button, a, div, span');
                for (let el of allNodes) {
                    if (el.textContent && el.textContent.trim().toLowerCase() === 'get started') {
                        getStartedBtn = el.tagName === 'SPAN' || el.tagName === 'DIV' ? (el.closest('button, a') || el) : el;
                        break;
                    }
                }

                let cmpWrapperCandidates = document.querySelectorAll('.cmp-accessibility-btn, iframe[src*="accessibility"], [id*="cmp-accessibility"], [class*="cmp-accessibility"], acc-widget, .injected-cmp-widget');
                let cmpWrapper = Array.from(cmpWrapperCandidates).find(el => el.tagName !== 'SCRIPT');

                if (!cmpWrapper) {
                    const directChildren = Array.from(document.body.children);
                    for (const el of directChildren) {
                        const tag = el.tagName;
                        if (tag !== 'SCRIPT' && tag !== 'STYLE' && tag !== 'NOSCRIPT' && tag !== 'LINK' && el.id !== 'root' && el.id !== 'custom-legal-footer' && el.id !== 'portal-tab-custom' && el.id !== 'debug-fw-panel') {
                            const style = window.getComputedStyle(el);
                            if (style.position === 'fixed' || el.shadowRoot || parseInt(style.zIndex, 10) > 1000) {
                                if (typeof el.className === 'string' && !el.className.toLowerCase().includes('chat') && !(el.id || '').toLowerCase().includes('chat')) {
                                    el.classList.add('injected-cmp-widget');
                                    cmpWrapper = el;
                                    break;
                                }
                            }
                        }
                    }
                }

                // Inject Custom Pricing Table
                let pricingSection = document.getElementById('pricing');
                if (pricingSection && !pricingSection.hasAttribute('data-custom-pricing')) {
                    // Replace the contents completely with our custom UI
                    pricingSection.innerHTML = window.__CUSTOM_PRICING_HTML__;
                    pricingSection.setAttribute('data-custom-pricing', 'true');
                    pricingSection.style.padding = '0'; // Overwrite default padding
                }



                // Try both visual absolute positioning and native placement if needed
                if (getStartedBtn && cmpWrapper) {
                    const rect = getStartedBtn.getBoundingClientRect();
                    
                    if (rect.width > 0 && rect.top >= 0) {
                        cmpWrapper.style.setProperty('position', 'fixed', 'important');
                        cmpWrapper.style.setProperty('bottom', 'auto', 'important');
                        cmpWrapper.style.setProperty('right', 'auto', 'important');
                        cmpWrapper.style.setProperty('margin', '0', 'important');
                        cmpWrapper.style.setProperty('transform', 'none', 'important');
                        
                        const cmpWidth = cmpWrapper.offsetWidth || 50; 
                        const cmpHeight = cmpWrapper.offsetHeight || 50;
                        const topPos = rect.top + (rect.height / 2) - (cmpHeight / 2);
                        const leftPos = rect.left - cmpWidth - 16;

                        cmpWrapper.style.setProperty('top', topPos + 'px', 'important');
                        cmpWrapper.style.setProperty('left', leftPos + 'px', 'important');
                        cmpWrapper.style.setProperty('z-index', '99999', 'important');
                        cmpWrapper.style.setProperty('display', 'block', 'important');
                        cmpWrapper.style.setProperty('visibility', 'visible', 'important');
                        cmpWrapper.style.setProperty('opacity', '1', 'important');
                        
                    } else {
                        // Position fallback if button hidden
                    }
                }
            } catch (e) {
                console.error('Error repositioning accessibility widget:', e);
            }

            injectLegalFooter();

            document.querySelectorAll('button, a, span, div, p').forEach(el => {
                const text = el.textContent.trim();
                const lowerText = text.toLowerCase();

                if (el.tagName === 'BUTTON' && el.querySelector('svg')) {
                    if(el.classList.contains('hide-element')) el.classList.remove('hide-element');
                    const style = window.getComputedStyle(el);
                    if (style.position === 'fixed' || style.position === 'absolute') {
                        el.style.setProperty('display', 'flex', 'important');
                        el.style.setProperty('visibility', 'visible', 'important');
                        el.style.setProperty('opacity', '1', 'important');
                        el.style.setProperty('z-index', '99999', 'important');
                    }
                }

                if (!text) return;

                if (lowerText === 'explore app' || text === 'Admin') {
                    const target = el.closest('button') || el.closest('a') || el;
                    if (target) {
                        target.classList.add('hide-element');
                    }
                }

                if (lowerText.includes('introductory')) {
                    if (el.children.length === 0) {
                        const target = el.closest('div') || el;
                        if (target.textContent.length < 200) {
                            target.classList.add('hide-element');
                        } else {
                            el.classList.add('hide-element');
                        }
                    }
                }

                if (el.children.length === 0) {
                    // Address update
                    if (text.includes('San Francisco - proposed') || text.includes('Bangalore - proposed') || text.includes('560001')) {
                        el.textContent = 'Mumbai, Maharashtra, INDIA 400051';
                    }
                    // Phone update (targeting the pattern in the screenshot)
                    if (text.includes('+91') && (text.includes('9') || text.includes('x'))) {
                        el.textContent = '+91 7045868482';
                    }
                    // Email update
                    if (text === 'sales@futurewave.in') {
                        el.textContent = 'checkin_support@futurewave.in';
                    }
                }

                // Update Link Hrefs
                if (el.tagName === 'A') {
                    if (el.href.includes('mailto:sales@futurewave.in')) {
                        el.href = 'mailto:checkin_support@futurewave.in';
                    }
                    if (el.href.startsWith('tel:') && (el.href.includes('9') || el.href.includes('x'))) {
                        el.href = 'tel:+917045868482';
                    }
                }
            });
        };

        // Run immediately and then frequently to combat SPA state changes
        applyFixes();
        window.addEventListener('load', applyFixes);
        setInterval(applyFixes, 800);

        // Smooth scroll for Contact Us
        document.addEventListener('click', (e) => {
            const target = e.target.closest('a, button, span, p, div');
            if (!target || !target.textContent) return;
            
            const text = target.textContent.trim().toLowerCase();
            if (text === 'contact us' || text.includes('contact us')) {
                // Ensure it's actually acting as a link/button
                if (window.getComputedStyle(target).cursor === 'pointer' || target.tagName === 'A' || target.tagName === 'BUTTON') {
                    e.preventDefault();
                    // Find the Get in Touch section header or the pill above it
                    const headers = document.querySelectorAll('h1, h2, h3, h4, div, span, p');
                    for (let h of headers) {
                        const txt = h.textContent.trim().toLowerCase();
                        if (txt === 'get in touch' || txt === "we'd love to hear from you") {
                            // Find the parent section to ensure we don't cut off the top
                            const section = h.closest('section');
                            if (section) {
                                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
                            } else {
                                // Fallback to absolute positioning with an offset so the pill isn't cut off
                                const y = h.getBoundingClientRect().top + window.scrollY - 80;
                                window.scrollTo({ top: y, behavior: 'smooth' });
                            }
                            return; // Stop after scrolling
                        }
                    }
                }
            }
        });
    </script>
    <script src="https://static.famous.ai/events.js"></script>
</body>

</html>
